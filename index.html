<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catálogo RFID y NFC | TAPEC</title>
<link rel="stylesheet" href="style.css?v=4">
<script defer src="products.js?v=4"></script>
<script defer src="catalog.js?v=4"></script>
</head>
<body>
<header><div class="wrap masthead"><a class="brand" href="./">TAPEC</a><span>Catálogo</span></div></header>
<main class="wrap">
  <div class="intro"><h1>Catálogo RFID y NFC</h1></div>
  <div class="layout">
    <section aria-label="Productos">
      <div class="tools">
        <label for="search" class="sr-only">Buscar productos</label>
        <input type="search" id="search" placeholder="Buscar tarjetas, pulseras, lectores…">
        <label for="category" class="sr-only">Categoría</label>
        <select id="category"><option value="">Todos los productos</option></select>
      </div>
      <p id="count" role="status"></p>
      <div id="grid" class="grid"></div>
      <p id="empty" hidden>No se encontraron productos.</p>
      <nav aria-label="Páginas del catálogo" id="pagination" hidden><button id="previous">Anterior</button><span id="page"></span><button id="next">Siguiente</button></nav>
      <noscript>Activa JavaScript para buscar y filtrar productos.</noscript>
    </section>
  </div>
</main>
<dialog id="detail" aria-labelledby="detail-title">
  <form method="dialog" class="detail-toolbar">
    <span class="brand">TAPEC</span>
    <button type="submit" autofocus aria-label="Cerrar ficha">Cerrar</button>
  </form>
  <div id="detail-image"></div>
  <div class="detail-copy">
    <p id="detail-category"></p>
    <h2 id="detail-title"></h2>
  </div>
</dialog>
<footer><div class="wrap">TAPEC</div></footer>
</body>
</html>
